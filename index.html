<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: una columna con cuatro vistas (Inicio, Mi día, Confirmar, Historial) y barra de navegación inferior fija. */
:root {
  --bg: #0a0a0a;
  --surface: #151213;
  --surface2: #1c1718;
  --line: #3a2c2a;
  --fg: #f4e8e0;
  --muted: #a8968c;
  --rose: #e8b79e;
  --gold: #f5c06a;
  --red: #e8200f;
  --wine: #6a0000;
  --ok: #bfe8c9;
  --okbg: #1e4d2b;
  --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ctl: #0e0b0b; --bar: #5a4a44; --navbg: #0d0b0b; --sumbg: rgba(10, 10, 10, 0.95);
  --redt: #ff9a8a; --goldt: #ffe3a3; --lead: #f0a030; --cenc: #f7dccb; --toastbg: #2a1a14;
  --med1: #2a1a14; --med2: #0a0a0a; --chipbg: #5a4036; --pillborder: #7a5444;
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #ffffff; --surface: #f8f1ec; --surface2: #f1e6de; --line: #dccabd;
  --fg: #2a1a16; --muted: #7a665c; --rose: #9a4630; --gold: #a8710e;
  --red: #d41a0a; --ok: #14532d; --okbg: #d7f0de;
  --ctl: #ffffff; --bar: #d9c6bb; --navbg: #ffffff; --sumbg: rgba(255, 255, 255, 0.96);
  --redt: #c41200; --goldt: #8a5a00; --lead: #a86400; --cenc: #8a6a5a; --toastbg: #ffffff;
  --med1: #fff6ec; --med2: #f2d9c4; --chipbg: #d9b8a8; --pillborder: #c89a86;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 150px;
}
.app { max-width: 520px; margin: 0 auto; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.brand { font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1; color: var(--rose); }
.who-chip { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.who-chip b { color: var(--fg); font-weight: 500; }
.tools { display: flex; gap: 6px; align-items: center; }
.theme-btn { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
.theme-btn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.dates { text-align: center; color: var(--muted); font-size: 12px; margin: 0 0 10px; letter-spacing: 0.03em; }

.banner { border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; border: 1px dashed #8a6a2a; background: var(--surface); color: var(--gold); }
.banner.red { border-color: #7a1a10; color: var(--redt); }
.banner button { margin-left: 8px; background: none; border: 0; color: var(--rose); text-decoration: underline; cursor: pointer; padding: 0; }

.frame { border-radius: 20px; padding: 3px; background-image: linear-gradient(135deg, #f2d2c0, #b87a5a 30%, #5c0000 55%, #e8200f 75%, #f5c06a); margin-bottom: 14px; }
.frame > div { background: var(--bg); border-radius: 18px; padding: 16px 14px; }
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sc span { display: block; font-size: 12px; color: var(--muted); }
.sc b { font-family: var(--display); font-weight: 500; font-size: 40px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.sc.r b { color: var(--redt); }
.sc.b { text-align: right; }
.sc.b b { color: var(--gold); }
.scale { display: block; width: 100%; height: auto; }
.prizes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 2px 0 16px; }
.prizes div { font-size: 12px; color: var(--muted); line-height: 1.35; }
.prizes b { display: block; font-size: 13px; font-weight: 500; }
.prizes .l b { color: var(--redt); }
.prizes .r { text-align: right; }
.prizes .r b { color: var(--gold); }
.barw { padding: 0 12px; }
.bar { position: relative; height: 2px; border-radius: 1px; background: var(--bar); }
.fill { position: absolute; top: 0; bottom: 0; transition: left 0.3s, width 0.3s; }
.fill.fr { background: #ff5a48; box-shadow: 0 0 10px #ff5a48; }
.fill.fb { background: var(--gold); box-shadow: 0 0 10px var(--gold); }
.cen { position: absolute; left: 50%; top: -8px; bottom: -8px; width: 1px; background: var(--cenc); }
.ind { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); background: #fff3dc; box-shadow: 0 0 12px 3px rgba(245, 192, 106, 0.7); transition: left 0.3s; }
.lbls { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding-top: 12px; }
.lead { text-align: center; font-size: 13px; color: var(--lead); margin: 10px 0 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 10px; }
.card.gold { border-color: var(--gold); background-image: radial-gradient(120% 160% at 0% 0%, rgba(245, 192, 106, 0.22), transparent 60%); box-shadow: 0 8px 22px rgba(245, 192, 106, 0.2); }
.card h3 { font-family: var(--display); font-weight: 600; font-size: 20px; color: var(--rose); margin: 0 0 4px; }
.card p { margin: 0; }
.muted { color: var(--muted); font-size: 12px; }
h2.sec { font-family: var(--display); font-weight: 600; font-size: 22px; color: var(--rose); margin: 18px 0 8px; display: flex; align-items: baseline; gap: 10px; }
h2.sec small { font-family: var(--body); font-size: 12px; color: var(--muted); font-weight: 400; }

.btn { display: block; width: 100%; font-weight: 500; color: #fff; cursor: pointer; background-image: linear-gradient(180deg, #ff4a38, #c41200 55%, #7a0000); border: 1px solid var(--rose); border-radius: 24px; padding: 12px 18px; text-align: center; }
.btn[disabled] { opacity: 0.45; cursor: default; }
.btn.ghost { background: none; color: var(--rose); }
.btn.sm { display: inline-block; width: auto; padding: 8px 14px; font-size: 13px; }
.btn.ok { background-image: none; background: var(--okbg); color: var(--ok); border-color: #2f7a45; }
.btn.no { background: none; color: var(--rose); border-color: #7a5a3a; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }

.rows { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.row.off { cursor: default; opacity: 0.7; }
.row.sel { border-color: var(--rose); background: var(--surface2); }
.chk { flex: none; width: 24px; height: 24px; border-radius: 7px; border: 1.5px solid #6a5a4a; background: var(--ctl); display: flex; align-items: center; justify-content: center; color: transparent; font-size: 15px; }
.row.sel .chk { background: var(--red); border-color: var(--rose); color: #fff; }
.row .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row .nm small { display: block; font-size: 11px; color: var(--muted); }
.pts { flex: none; font-weight: 500; font-variant-numeric: tabular-nums; }
.row.t80 { border-color: #b3200f; background-image: radial-gradient(120% 160% at 0% 0%, rgba(232, 32, 15, 0.22), transparent 60%); box-shadow: 0 8px 18px rgba(232, 32, 15, 0.22); animation: float 4.6s ease-in-out infinite; }
.row.t100 { border-color: var(--gold); background-image: radial-gradient(120% 160% at 0% 0%, rgba(245, 192, 106, 0.26), transparent 60%); box-shadow: 0 10px 24px rgba(245, 192, 106, 0.26); animation: float 3.8s ease-in-out infinite; }
.row.t80 .pts { color: var(--redt); }
.row.t100 .pts { color: var(--goldt); }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
.tag { display: inline-block; font-size: 11px; border-radius: 999px; padding: 2px 9px; border: 1px solid var(--line); color: var(--muted); }
.tag.pend { color: var(--gold); border-color: #7a5a1a; }
.tag.conf { color: var(--ok); border-color: #2f7a45; background: var(--okbg); }
.tag.rej { color: var(--redt); border-color: #7a1a10; }
.tag.sur { color: #2a1600; background: var(--gold); border-color: var(--gold); }
.photo-row { display: flex; align-items: center; gap: 10px; margin: -4px 0 0 34px; padding: 6px 0 2px; font-size: 13px; }
.photo-row label { color: var(--rose); border: 1px dashed var(--pillborder); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.photo-row input { display: none; }
.thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 1px solid var(--line); cursor: pointer; background: var(--ctl); }

.sumbar { position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 10px max(16px, env(safe-area-inset-left, 0px)) 10px; background: var(--sumbg); border-top: 1px solid var(--line); }
.sumbar .in { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 6px; }
.sumbar .tot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.sumbar .tot b { font-family: var(--display); font-size: 22px; color: var(--gold); font-weight: 500; }

nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--navbg); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
nav .in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav button { background: none; border: 0; color: var(--muted); padding: 9px 4px 8px; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; position: relative; }
nav button[aria-current="page"] { color: var(--gold); }
nav svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
nav .badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 17px; height: 17px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { font-size: 12px; color: var(--rose); background: var(--surface2); border: 1px solid var(--chipbg); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.chip[aria-pressed="true"] { background-image: linear-gradient(180deg, #8a0a00, #4a0000); color: #fff; border-color: var(--rose); }
.thanks-in { display: flex; gap: 6px; margin-top: 8px; }
.thanks-in input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--ctl); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.hist { display: flex; gap: 10px; align-items: flex-start; }
.hist .info { flex: 1; min-width: 0; }
.hist .t { margin: 0; overflow-wrap: anywhere; }
.hist .m { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.hist .th { margin: 6px 0 0; font-size: 13px; color: var(--rose); font-style: italic; overflow-wrap: anywhere; }
.hist .p { font-weight: 500; font-variant-numeric: tabular-nums; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }

.overlay { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.9); display: flex; align-items: center; justify-content: center; padding: 20px; }
.overlay img { max-width: 100%; max-height: 80vh; border-radius: 12px; }
.pick { max-width: 340px; width: 100%; text-align: center; }
.pick h2 { font-family: var(--display); font-weight: 600; font-size: 30px; margin: 0 0 6px; color: var(--rose); }
.pick p { color: var(--muted); margin: 0 0 16px; }
.pick .btn { margin-bottom: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(150px + env(safe-area-inset-bottom, 0px)); z-index: 30; background: var(--toastbg); border: 1px solid var(--rose); color: var(--fg); padding: 10px 16px; border-radius: 999px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .row.t80, .row.t100 { animation: none; } .fill, .ind { transition: none; } }
.login { max-width: 340px; width: 100%; text-align: center; }
.login h2 { font-family: var(--display); font-weight: 600; font-size: 38px; margin: 0 0 4px; color: var(--rose); }
.login p { color: var(--muted); margin: 0 0 16px; }
.login input { display: block; width: 100%; font: inherit; font-size: 16px; color: var(--fg); background: var(--ctl); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.login .err { color: var(--redt); font-size: 13px; min-height: 18px; margin: 0 0 8px; }
.login .btn { margin-bottom: 10px; }

:root { --bg:#050404; --surface:#0f0b09; --surface2:#17110d; --line:#4a3520; --fg:#f6ead9; --muted:#b9a68e; --rose:#E3B06A; --gold:#E8B66E; --red:#B0283D; --wine:#5a0f1a; --redt:#EE8C96; --goldt:#FFE4A0; --lead:#E8B66E; --cenc:#E8B66E; --ctl:#0b0807; --bar:#3a2b1c; --navbg:#080605; --sumbg:rgba(8,6,5,.96); --toastbg:#17110d; --med1:#2a1a0c; --med2:#050403; --chipbg:#5a4125; --pillborder:#8a6a3a; --display:"Cormorant Garamond",Georgia,serif; }
:root[data-theme="light"] { --bg:#F6EEE6; --surface:#FFFAF4; --surface2:#F1E4D8; --line:#d9bfa4; --fg:#33221a; --muted:#7d6552; --rose:#8a4b2a; --gold:#9a6320; --red:#B0283D; --redt:#B0283D; --goldt:#7a4a10; --lead:#9a6320; --cenc:#9a6320; --ctl:#fff; --bar:#e3cdb8; --navbg:#FFFAF4; --sumbg:rgba(255,250,244,.96); --toastbg:#fff; --med1:#FFF6EC; --med2:#EFD6C0; --chipbg:#d9b8a8; --pillborder:#c89a86; }
body { background: radial-gradient(130% 55% at 50% -5%, #2b1b0d 0%, #0b0706 46%, #050404 100%) fixed; }
:root[data-theme="light"] body { background: radial-gradient(120% 60% at 50% -6%, #FFF8F0 0%, #F0DED2 55%, #E3C4B8 100%) fixed; }
.top { align-items: flex-start; margin-bottom: 4px; }
.logo { height: 104px; width: auto; display: block; mix-blend-mode: screen; }
:root[data-theme="light"] .logo { mix-blend-mode: normal; background: #000; border-radius: 16px; padding: 2px 8px; height: 88px; }
.login .logo { margin: 0 auto 8px; }
.tools { gap: 8px; padding-top: 10px; }
.theme-btn { width: 40px; height: 40px; background: var(--surface); border: 1px solid var(--line); color: var(--gold); }
.theme-btn svg { width: 19px; height: 19px; }
.season { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 4px 0 14px; text-align: center; }
.season .vl { width: 1px; height: 44px; background: linear-gradient(transparent, var(--gold), transparent); }
.season small { display: block; font-size: 11px; letter-spacing: .3em; color: var(--muted); }
.season b { display: block; font-size: 16px; letter-spacing: .14em; font-weight: 500; color: var(--fg); margin: 2px 0; }
.season em { display: block; font-style: normal; font-size: 10.5px; letter-spacing: .2em; color: var(--gold); }
.arena { border: 1px solid var(--gold); border-radius: 26px; padding: 14px 12px 16px; margin-bottom: 14px; background: radial-gradient(90% 55% at 50% 45%, rgba(232,182,110,.16), transparent 72%), var(--surface); box-shadow: 0 18px 40px rgba(0,0,0,.35), inset 0 0 40px rgba(232,182,110,.07); }
.arena .scores { display: flex; justify-content: space-between; padding: 0 6px; margin-bottom: -26px; position: relative; z-index: 2; }
.sc span { font-size: 12px; letter-spacing: .16em; display: block; }
.sc.r span { color: var(--redt); } .sc.b span { color: var(--gold); }
.sc b { font-family: var(--body); font-size: 44px; font-weight: 500; line-height: 1.05; display: block; color: var(--fg); }
.sc small { font-size: 10.5px; letter-spacing: .24em; color: var(--muted); }
.cap2 { text-align: center; font-size: 11px; letter-spacing: .26em; color: var(--muted); margin: 2px 0 12px; }
.arena .barw { padding: 0 14px; }
.pzs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-bottom: 16px; }
.pz { position: relative; display: block; width: 100%; text-align: center; border-radius: 20px; padding: 14px 8px 12px; border: 1px solid; cursor: pointer; color: var(--fg); }
.pz.r { border-color: rgba(224,112,124,.7); background: radial-gradient(120% 90% at 50% 0%, rgba(176,40,61,.38), var(--surface) 78%); }
.pz.b { border-color: rgba(232,182,110,.75); background: radial-gradient(120% 90% at 50% 0%, rgba(217,151,77,.28), var(--surface) 78%); }
.pz .ic { width: 84px; height: 58px; margin: 6px auto 8px; } .pz .ic svg { width: 100%; height: 100%; display: block; filter: drop-shadow(0 4px 8px rgba(0,0,0,.45)); }
.pz small { display: block; font-size: 10.5px; letter-spacing: .18em; } .pz.r small { color: var(--redt); } .pz.b small { color: var(--gold); }
.pz b { display: block; font-weight: 500; font-size: 15px; line-height: 1.25; margin: 6px 0 10px; }
.pz .go, .pz .crown { display: flex; align-items: center; justify-content: center; border: 1px solid; border-radius: 50%; }
.pz .go { width: 32px; height: 32px; margin: 0 auto; } .pz .crown { position: absolute; top: 9px; right: 9px; width: 26px; height: 26px; }
.pz.r .go, .pz.r .crown { color: var(--redt); } .pz.b .go, .pz.b .crown { color: var(--gold); }
.pz svg:not(.ic svg) { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pv { text-align: center; padding-top: 4px; position: relative; }
.pv .back { position: absolute; left: 0; top: 0; }
.pv .crownb { width: 44px; height: 44px; border: 1px solid; border-radius: 50%; margin: 6px auto 8px; display: flex; align-items: center; justify-content: center; }
.pv.r .crownb, .pv.r .pl { color: var(--redt); } .pv.b .crownb, .pv.b .pl { color: var(--gold); }
.pv .crownb svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linejoin: round; }
.pv .pl { letter-spacing: .22em; font-size: 14px; margin: 0 0 18px; }
.pv .halo { width: 210px; height: 210px; border-radius: 50%; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; border: 1px solid; }
.pv.r .halo { border-color: rgba(224,112,124,.5); background: radial-gradient(circle, rgba(176,40,61,.35), transparent 70%); } .pv.b .halo { border-color: rgba(232,182,110,.55); background: radial-gradient(circle, rgba(217,151,77,.3), transparent 70%); }
.pv .halo svg { width: 150px; height: 100px; filter: drop-shadow(0 6px 12px rgba(0,0,0,.5)); }
.pv .pn { font-family: var(--body); font-weight: 500; font-size: 28px; line-height: 1.15; margin: 0; color: var(--fg); }
.pv .rule { width: 36px; height: 2px; background: var(--gold); margin: 12px auto; }
.pv .pd { color: var(--muted); margin: 0 12px 18px; }
.pv .infos { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 4px 14px; margin-bottom: 18px; text-align: left; }
.pv .ir { display: flex; justify-content: space-between; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; } .pv .ir:last-child { border-bottom: 0; }
.pv .ir span { color: var(--muted); } .pv .ir b { font-weight: 500; text-align: right; }
.btn { background-image: linear-gradient(180deg, #EE7E88, #C9485F 55%, #8E1F33); border-color: rgba(255,214,200,.55); }
.btn.ghost { background: none; color: var(--rose); border-color: var(--line); }
nav { border-radius: 22px 22px 0 0; border-top: 1px solid var(--line); }
.card.gold, .row.t100 { --gold: #E8B66E; }

/* ===== rediseño corazón ===== */

function shrink(file) {
  return new Promise(function (res, rej) {
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(function (b) { b ? res(b) : rej(new Error("blob")); }, "image/jpeg", 0.8);
    };
    img.onerror = function () { URL.revokeObjectURL(u); rej(new Error("img")); };
    img.src = u;
  });
}

function makeDb() {

    collection: function (c) {
      return { onSnapshot: function (fn, errfn) {
        var busy = false, again = false;
        async function load() {
          if (busy) { again = true; return; }
          busy = true;
          try {
            var q = await sb.from("millas_docs").select("id,data").eq("collection", c);
            if (q.error) throw q.error;
            fn({ docs: q.data.map(function (x) { return { id: x.id, data: function () { return x.data; } }; }) });
          } catch (e) { if (errfn) errfn(e); }
          busy = false;
          if (again) { again = false; load(); }
        }
        load();
        sb.channel("mc-" + c).on("postgres_changes", { event: "*", schema: "public", table: "millas_docs", filter: "collection=eq." + c }, load).subscribe();
        document.addEventListener("visibilitychange", function () { if (!document.hidden) load(); });
      } };
    },
    doc: function (path) {
      var k = path.indexOf("/"), c = path.slice(0, k), id = path.slice(k + 1);
